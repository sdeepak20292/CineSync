# Application
spring.application.name=seat-booking-system

# MySQL Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/seat_booking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379	

# Server
server.port=8080

# Logging
logging.level.com.booking.seatbooking=DEBUG

# JWT Configuration
jwt.secret=${JWT_SECRET:replace-this-with-a-real-32-byte-secret-before-deploying}
jwt.expiration-ms=3600000
jwt.header-name=Authorization
jwt.token-prefix=Bearer 

# Spring Security Standard Formats
server.servlet.session.tracking-modes=cookie
